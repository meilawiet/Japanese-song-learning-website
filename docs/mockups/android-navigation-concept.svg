<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1040" viewBox="0 0 1380 1040">
  <defs>
    <style>
      .zh { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#1f2827; }
      .muted { fill:#718079; }
      .serif { font-family: "Microsoft YaHei", "Noto Serif CJK SC", serif; }
      .tiny { font-size:13px; }
      .small { font-size:16px; }
      .body { font-size:19px; }
      .title { font-size:34px; font-weight:700; }
      .tab { font-size:14px; font-weight:600; }
      .caption { font-size:19px; font-weight:700; letter-spacing:1px; }
    </style>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#2d4941" flood-opacity=".13"/>
    </filter>
    <g id="brand">
      <circle cx="0" cy="0" r="17" fill="#1f2827"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#fff">う</text>
      <text x="28" y="8" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#1f2827">UTA<tspan fill="#e25c38">.</tspan></text>
    </g>
    <g id="learn-icon" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-13-10c5-2 9-1 13 2v19c-4-3-8-4-13-2zM13-10c-5-2-9-1-13 2v19c4-3 8-4 13-2z"/>
      <path d="M-10-4h5M5-4h5"/>
    </g>
    <g id="review-icon" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10-8a13 13 0 1 0 3 12M10-8v-6M10-8h-6"/>
      <path d="M0-6v7l5 3"/>
    </g>
    <g id="me-icon" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-7" r="6"/><path d="M-13 12c1-8 6-12 13-12s12 4 13 12"/>
    </g>
    <g id="chevron" fill="none" stroke="#64766c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-3-6l6 6-6 6"/></g>
  </defs>
  <rect width="1380" height="1040" fill="#e8eee9"/>
  <path d="M0 0h1380v195H0z" fill="#d9e8e0"/>
  <circle cx="1270" cy="80" r="145" fill="#f0bd48" opacity=".29"/>
  <circle cx="70" cy="960" r="210" fill="#c5ded6" opacity=".7"/>
  <text class="zh" x="74" y="63" font-size="16" font-weight="700" letter-spacing="3" fill="#557066">UTA · ANDROID UI CONCEPT</text>
  <text class="zh serif title" x="74" y="113" font-size="42">三入口底部导航 · 草图概念稿</text>
  <text class="zh muted" x="74" y="150" font-size="18">启动进入学习；复习和“我的”可随时从底部切换。页面内容先保留入口，模式细节后续再定。</text>

  <!-- 第一屏：应用启动后进入学习页，学习模式目前只保留一个入口。 -->
  <text class="zh caption" x="86" y="227">01  学习 / 应用首页</text>
  <rect x="76" y="249" width="370" height="660" rx="31" fill="#1f2827" filter="url(#shadow)"/>
  <rect x="84" y="257" width="354" height="644" rx="25" fill="#f5f2eb"/>
  <rect x="84" y="257" width="354" height="41" rx="25" fill="#f5f2eb"/>
  <text class="zh" x="108" y="286" font-size="13" font-weight="700">9:41</text>
  <path d="M381 277h8m4-3v6m7-10v10m7-6v6" stroke="#1f2827" stroke-width="2"/>
  <rect x="415" y="273" width="15" height="9" rx="2" fill="none" stroke="#1f2827" stroke-width="1.5"/>
  <rect x="417" y="275" width="10" height="5" rx="1" fill="#1f2827"/>
